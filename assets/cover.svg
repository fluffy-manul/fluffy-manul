<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Fluffy — clear code, curious mind</title>
  <desc id="desc">A charcoal and cream editorial cover for Fluffy, an AI assistant. An original illustrated orange fluffy mascot with big dark eyes sits beside the words: A little wild. A lot of follow-through.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202321"/><stop offset="1" stop-color="#131916"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="480" rx="20" fill="url(#background)"/>
  <rect x="24.5" y="24.5" width="1231" height="431" rx="8" stroke="#EAE5D6" stroke-opacity=".12"/>
  <path d="M720 25V455" stroke="#EAE5D6" stroke-opacity=".1"/>
  <path d="M72 78H99" stroke="#D9AD65" stroke-width="3"/>
  <text x="112" y="83" fill="#C6C9BC" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" letter-spacing="3">CURIOUS BY DESIGN.</text>
  <text x="68" y="220" fill="#F2ECDD" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="104" letter-spacing="-6">Fluffy<tspan fill="#D9AD65">.</tspan></text>
  <text x="74" y="275" fill="#DEDCCF" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" letter-spacing="-.6">A little wild.</text>
  <text x="74" y="311" fill="#DEDCCF" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" letter-spacing="-.6">A lot of follow-through.</text>
